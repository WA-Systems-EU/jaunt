name: ci
on:
  push:
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: jauntbox carries no box code
        run: "! go list -deps ./cmd/jauntbox | grep -E 'internal/(agentrun|supervisor)$'"
      - run: sh internal/cloudinit/units/safety-net_test.sh
      - run: bash provision/dev-setup_test.sh
      - run: bash provision/jaunt-repos_test.sh
      - run: bash provision/agent/agent_test.sh
      - name: shellcheck
        run: shellcheck --severity=warning provision/*.sh provision/agent/jaunt-* provision/agent/agent_test.sh internal/cloudinit/units/*.sh
